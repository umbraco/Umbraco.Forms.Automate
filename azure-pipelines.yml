name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - dev
      - release/*
      - hotfix/*
      - feature/*

pr:
  branches:
    include:
      - main
      - dev

resources:
  repositories:
    - repository: build
      type: github
      name: umbraco/Umbraco.Build
      endpoint: umbraco

parameters:
  - name: cache_nuget
    displayName: Cache NuGet packages
    type: boolean
    default: true
  - name: sbom_generate
    displayName: Generate SBOM and check licenses (no upload off release/hotfix)
    type: boolean
    default: false # SBOM is still generated for release/* and hotfix/* branches

# Read by the shared Umbraco.Build SBOM stage
variables:
  - name: solution
    value: Umbraco.Forms.Automate.slnx
  - name: productName
    value: Umbraco.Forms.Automate
  - name: vmImage
    value: ubuntu-latest

stages:
  - stage: Build
    displayName: Build & Pack
    jobs:
      - template: .devops/build-and-pack.yml
        parameters:
          solution: Umbraco.Forms.Automate.slnx
          cache_nuget: ${{ parameters.cache_nuget }}

  # umbraco-sbom SBOM + license policy check, in parallel with Build. A policy violation fails the run.
  # Only release/hotfix builds upload to Dependency-Track, as "Umbraco.Forms.Automate v<major>".
  - template: devops/stages/sbom.yml@build
    parameters:
      sbom_generate: ${{ parameters.sbom_generate }}
      sbom_upload: ${{ or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}
      sbom_dt_variable_group: dependency-track

  - stage: Test
    dependsOn: Build
    jobs:
      - template: .devops/test.yml
        parameters:
          solution: Umbraco.Forms.Automate.slnx
